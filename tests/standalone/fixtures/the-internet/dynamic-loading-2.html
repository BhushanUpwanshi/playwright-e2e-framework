<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>The Internet</title>
    <style>
        #loading { display: none; align-items: center; gap: 12px; }
        .spinner {
            width: 32px;
            height: 32px;
            border: 4px solid #ddd;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="example">
        <h3>Dynamically Loaded Page Elements</h3>
        <h4>Example 2: Element rendered after the fact</h4>
        <div id="start"><button>Start</button></div>
        <div id="loading"><div class="spinner"></div>Loading...</div>
    </div>
    <script>
        // Mirrors the original: #finish is not in the DOM until loading ends,
        // and the spinner animates the whole time so the screencast has
        // repaints to record.
        document.querySelector('#start button').addEventListener('click', () => {
            document.getElementById('start').style.display = 'none';
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';

            setTimeout(() => {
                loading.style.display = 'none';
                const finish = document.createElement('div');
                finish.id = 'finish';
                finish.innerHTML = '<h4>Hello World!</h4>';
                document.querySelector('.example').appendChild(finish);
            }, 5000);
        });
    </script>
</body>
</html>
